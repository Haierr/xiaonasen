<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">小纳森 · Xiaonasen</title>
  <desc id="desc">说得自然，写得轻松。Speak naturally. Write effortlessly. Local Chinese dictation with optional English translation.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#24272b"/><stop offset="1" stop-color="#121518"/></linearGradient>
    <linearGradient id="gold"><stop stop-color="#f0dab0"/><stop offset=".5" stop-color="#ceb17a"/><stop offset="1" stop-color="#8d744d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#d0b37b" stop-opacity=".16"/><stop offset="1" stop-color="#d0b37b" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="408" rx="26" fill="url(#panel)" stroke="#575044"/>
  <circle cx="967" cy="163" r="248" fill="url(#glow)"/>
  <path d="M795 1h377q27 0 27 27v353q0 27-27 27H795" fill="none" stroke="#bda170" stroke-opacity=".1"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, Arial, sans-serif">
    <text x="64" y="61" font-size="12" letter-spacing="3" fill="#b6a382">ON-DEVICE DICTATION / 本地语音输入</text>
    <text x="62" y="143" font-size="63" font-weight="700" fill="#f1ece1">小纳森</text>
    <text x="66" y="195" font-size="29" letter-spacing="7" fill="url(#gold)">XIAONASEN</text>
    <text x="66" y="251" font-size="25" fill="#e6dcc8">说得自然，写得轻松。</text>
    <text x="66" y="283" font-size="18" fill="#9da4aa">Speak naturally. Write effortlessly.</text>
    <rect x="64" y="328" width="578" height="45" rx="12" fill="#282a2a" stroke="#554d40"/>
    <text x="83" y="357" font-size="14" fill="#d6c5a5">Ctrl+R</text><text x="146" y="357" font-size="13" fill="#a7adb3">Speak / 说话</text>
    <text x="259" y="357" font-size="14" fill="#d6c5a5">T</text><text x="280" y="357" font-size="13" fill="#a7adb3">中文 ↔ English</text>
    <text x="425" y="357" font-size="14" fill="#d6c5a5">Ctrl+R</text><text x="491" y="357" font-size="13" fill="#a7adb3">Insert / 填入</text>
    <text x="904" y="317" font-size="12" text-anchor="middle" letter-spacing="2" fill="#bda170">SMALL PRESENCE. CLEAR FEEDBACK.</text>
    <text x="904" y="342" font-size="13" text-anchor="middle" fill="#8e969d">轻巧待机 · 清晰反馈</text>
  </g>
  <g fill="none" stroke="#d0b37b"><circle cx="904" cy="180" r="105" stroke-opacity=".25"/><circle cx="904" cy="180" r="128" stroke-opacity=".09"/><path d="M800 68a153 153 0 0 1 231 193" stroke-opacity=".14"/></g>
  <g stroke="url(#gold)" stroke-width="8" stroke-linecap="round">
    <path d="M843 172v16M863 156v48M883 133v94M904 118v124M925 143v74M945 160v40M965 172v16"/>
  </g>
  <circle cx="1108" cy="57" r="4" fill="#d0b37b"/><circle cx="770" cy="281" r="2" fill="#d0b37b" fill-opacity=".6"/>
</svg>
