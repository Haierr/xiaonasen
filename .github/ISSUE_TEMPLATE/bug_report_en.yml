name: Bug report · English
description: Report a usage or build problem with Xiaonasen
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App version, Windows version, GPU/driver and microphone type. Do not include serial numbers or private information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional screenshots or diagnostics
      description: Remove dictated text, personal paths, secrets and other sensitive data before sharing.
