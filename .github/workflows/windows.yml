name: Windows build and checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build native application
        shell: pwsh
        run: ./build.ps1
      - name: Model-free regression checks
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package lightweight app
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and package tag
        shell: pwsh
        run: |
          ./build.ps1
          ./scripts/package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          $version = (Get-Item ./dist/xiaonasen.exe).VersionInfo.FileVersion.Split('.')[0..2] -join '.'
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and application version do not match' }
          $assets = @((Get-ChildItem ./artifacts -Filter '*.zip').FullName) + @((Resolve-Path ./artifacts/SHA256SUMS.txt).Path)
          gh release create $env:RELEASE_TAG @assets --repo $env:REPO_NAME --verify-tag --title "小纳森 $version" --notes-file ./docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
